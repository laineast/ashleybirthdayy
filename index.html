<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ashley's birthday 💜</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap');

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #faf5ff 0%, #f0e6ff 50%, #ede0ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #d8a5ff;
      border-radius: 50%;
      opacity: 0.6;
      animation: twinkle 3s infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 50px 30px;
      box-shadow: 0 8px 32px rgba(178, 107, 237, 0.15);
      border: 1px solid rgba(210, 170, 255, 0.3);
      animation: slideIn 0.8s ease-out;
      position: relative;
      z-index: 10;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3em;
      color: #9d4edd;
      text-align: center;
      margin-bottom: 10px;
      letter-spacing: -1px;
      animation: fadeInDown 0.8s ease-out 0.2s both;
    }

    .subtitle {
      text-align: center;
      color: #b565d8;
      font-size: 1.1em;
      margin-bottom: 40px;
      animation: fadeInDown 0.8s ease-out 0.4s both;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .flower-decoration {
      text-align: center;
      font-size: 2em;
      margin: 20px 0;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .unlocks-container {
      display: grid;
      gap: 20px;
      margin: 30px 0;
    }

    .unlock-box {
      background: linear-gradient(135deg, #e0c3fc 0%, #f3e7e9 100%);
      border: 2px solid #d8a5ff;
      border-radius: 15px;
      padding: 25px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeInUp 0.8s ease-out backwards;
    }

    .unlock-box:nth-child(1) { animation-delay: 0.6s; }
    .unlock-box:nth-child(2) { animation-delay: 0.8s; }
    .unlock-box:nth-child(3) { animation-delay: 1s; }
    .unlock-box:nth-child(4) { animation-delay: 1.2s; }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .unlock-box:hover:not(.unlocked) {
      transform: translateY(-5px);
      box-shadow: 0 12px 24px rgba(178, 107, 237, 0.25);
      border-color: #c77dff;
    }

    .unlock-box.unlocked {
      background: linear-gradient(135deg, #c77dff 0%, #e0aaff 100%);
      cursor: default;
      border-color: #9d4edd;
    }

    .unlock-box.unlocked:hover {
      transform: none;
      box-shadow: 0 8px 16px rgba(157, 78, 221, 0.2);
    }

    .locked-text {
      font-size: 1.3em;
      color: #7209b7;
      font-weight: 600;
      text-align: center;
    }

    .unlock-box.unlocked .locked-text {
      display: none;
    }

    .unlocked-content {
      display: none;
      text-align: center;
      animation: revealContent 0.6s ease-out;
    }

    .unlock-box.unlocked .unlocked-content {
      display: block;
    }

    @keyframes revealContent {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .message-text {
      color: #fff;
      font-size: 1.1em;
      line-height: 1.6;
      font-weight: 500;
    }

    .memory-emoji {
      font-size: 2em;
      margin-bottom: 10px;
    }

    .fun-fact {
      color: #fff;
      font-style: italic;
      margin-top: 10px;
      font-size: 0.95em;
    }

    .progress-bar {
      margin-top: 40px;
      text-align: center;
    }

    .progress-text {
      color: #7209b7;
      font-size: 0.95em;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .bar {
      width: 100%;
      height: 8px;
      background: rgba(210, 170, 255, 0.3);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #d8a5ff;
    }

    .fill {
      height: 100%;
      background: linear-gradient(90deg, #c77dff, #e0aaff);
      border-radius: 10px;
      transition: width 0.6s ease-out;
    }

    .footer-message {
      margin-top: 30px;
      text-align: center;
      color: #b565d8;
      font-size: 0.95em;
      line-height: 1.6;
      opacity: 0.9;
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      background: #c77dff;
      pointer-events: none;
      z-index: 100;
    }

    .confetti.star {
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }

    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }

    .loading {
      text-align: center;
      color: #9d4edd;
      font-size: 1.2em;
    }

    .loading::after {
      content: '';
      animation: dots 1.5s steps(3, end) infinite;
    }

    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2em;
      }

      .container {
        padding: 30px 20px;
      }

      .unlock-box {
        min-height: 120px;
      }
    }
  </style>
</head>
<body>
  <div class="stars" id="starsContainer"></div>

  <div class="container">
    <h1>ashley 💜</h1>
    <p class="subtitle">happy birthday to my best friend</p>
    
    <div class="flower-decoration">🌸 💜 🌸</div>

    <div class="unlocks-container" id="unlocksContainer">
      <div class="loading">loading ashley's surprises</div>
    </div>

    <div class="progress-bar">
      <div class="progress-text">unlocked: <span id="progressText">0/4</span></div>
      <div class="bar">
        <div class="fill" id="progressFill"></div>
      </div>
    </div>

    <div class="footer-message">
      each moment with you is a memory i treasure. here are some of mine 💜
    </div>
  </div>

  <script>
    // GENERATE RANDOM STARS
    function generateStars() {
      const container = document.getElementById('starsContainer');
      for (let i = 0; i < 15; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 3 + 's';
        container.appendChild(star);
      }
    }

    // LOAD DATA FROM JSON
    async function loadAshleyData() {
      try {
        const response = await fetch('ashley-data.json');
        const data = await response.json();
        createUnlocks(data.unlocks, data.funFact);
      } catch (error) {
        console.error('couldnt load ashley data:', error);
        document.getElementById('unlocksContainer').innerHTML = 
          '<p class="loading">oops! something went wrong loading the surprises</p>';
      }
    }

    // CREATE INTERACTIVE UNLOCK BOXES
    function createUnlocks(unlocks, funFact) {
      const container = document.getElementById('unlocksContainer');
      container.innerHTML = '';

      unlocks.forEach((unlock, index) => {
        const box = document.createElement('div');
        box.className = 'unlock-box';
        box.id = `unlock-${index}`;

        const isUnlocked = localStorage.getItem(`ashley-unlock-${index}`) === 'true';
        if (isUnlocked) {
          box.classList.add('unlocked');
        }

        box.innerHTML = `
          <div class="locked-text">click to reveal 💜</div>
          <div class="unlocked-content">
            <div class="memory-emoji">${unlock.emoji}</div>
            <div class="message-text">${unlock.message}</div>
            ${index === unlocks.length - 1 ? `<div class="fun-fact">✨ ${funFact} ✨</div>` : ''}
          </div>
        `;

        box.addEventListener('click', function() {
          if (!this.classList.contains('unlocked')) {
            this.classList.add('unlocked');
            localStorage.setItem(`ashley-unlock-${index}`, 'true');
            triggerConfetti();
            updateProgress();
          }
        });

        container.appendChild(box);
      });

      updateProgress();
    }

    // UPDATE PROGRESS BAR
    function updateProgress() {
      const allBoxes = document.querySelectorAll('.unlock-box');
      const unlockedBoxes = document.querySelectorAll('.unlock-box.unlocked');
      const progress = (unlockedBoxes.length / allBoxes.length) * 100;
      
      document.getElementById('progressFill').style.width = progress + '%';
      document.getElementById('progressText').textContent = 
        `${unlockedBoxes.length}/${allBoxes.length}`;
    }

    // CONFETTI EFFECT
    function triggerConfetti() {
      for (let i = 0; i < 15; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti' + (Math.random() > 0.5 ? ' star' : '');
        confetti.style.left = Math.random() * 100 + '%';
        confetti.style.top = '-10px';
        confetti.style.background = ['#c77dff', '#e0aaff', '#d8a5ff', '#b565d8'][Math.floor(Math.random() * 4)];
        confetti.style.animation = `fall ${2 + Math.random() * 1}s linear`;
        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 3000);
      }
    }

    // INITIALIZE
    generateStars();
    loadAshleyData();
  </script>
</body>
  </html>
